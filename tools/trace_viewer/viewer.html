<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>Paper Reasoning Trace Viewer</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --line: #dce2e8;
    --muted: #64748b;
    --text: #17202a;
    --nav: #17212b;
    --blue: #1d5fa7;
    --green: #087a55;
    --red: #b42318;
    --amber: #a15c00;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; padding: 12px 18px; color: #fff; background: var(--nav); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  h1 { margin: 0 0 10px; font-size: 18px; letter-spacing: 0; }
  .build { margin-left: 8px; color: #9bc5ed; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .toolbar { display: grid; grid-template-columns: 170px 170px minmax(260px, 1fr) auto; gap: 8px; align-items: end; }
  .control { display: grid; gap: 4px; }
  label { color: #cbd5e1; font-size: 11px; font-weight: 700; }
  select, input, button { min-height: 34px; border-radius: 5px; font: 13px inherit; }
  select, input { width: 100%; border: 1px solid #526171; padding: 6px 8px; color: #fff; background: #263442; }
  button { border: 0; padding: 7px 12px; color: #fff; background: var(--blue); cursor: pointer; font-weight: 700; }
  button:disabled { opacity: .55; cursor: wait; }
  main { max-width: 1600px; margin: 0 auto; padding: 14px; }
  .layout { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 14px; }
  aside, .section { border: 1px solid var(--line); background: var(--panel); }
  aside { position: sticky; top: 116px; align-self: start; max-height: calc(100vh - 130px); overflow: hidden; }
  .aside-head, .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--line); background: #edf1f4; font-size: 13px; font-weight: 750; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 9px; border-bottom: 1px solid var(--line); }
  .filters input { grid-column: 1 / -1; color: var(--text); background: #fff; border-color: #b9c3ce; }
  .filters select { color: var(--text); background: #fff; border-color: #b9c3ce; }
  .sample-list { max-height: calc(100vh - 286px); overflow: auto; padding: 8px; }
  .sample { width: 100%; margin-bottom: 6px; padding: 8px 9px; text-align: left; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 5px; }
  .sample.active { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
  .sample-main { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .sample-sub { margin-top: 4px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { min-width: 0; display: grid; gap: 12px; }
  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
  .metric { min-width: 0; padding: 9px 11px; background: #fff; }
  .metric-key { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .metric-value { margin-top: 4px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; white-space: pre-wrap; }
  .stage-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 11px; }
  .pill { display: inline-flex; gap: 5px; align-items: center; padding: 3px 8px; border: 1px solid #ced7e0; border-radius: 999px; background: #f7f9fb; color: #344256; font-size: 11px; font-weight: 750; }
  .ok { color: var(--green); }
  .bad { color: var(--red); }
  .warn { color: var(--amber); }
  .tag { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .section-body { padding: 10px 11px; }
  .stage { border-top: 1px solid var(--line); }
  .stage:first-child { border-top: 0; }
  .stage > summary { display: flex; justify-content: space-between; gap: 10px; padding: 10px 11px; cursor: pointer; background: #f8fafb; font-size: 13px; font-weight: 750; }
  .stage-content { min-width: 0; padding: 11px; display: grid; gap: 10px; }
  .stage-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .json, .json-object, .json-array, .array-item { min-width: 0; }
  .json { display: grid; gap: 7px; }
  .json-row { min-width: 0; display: grid; gap: 9px; padding: 5px 0; border-bottom: 1px solid #edf1f4; }
  .json-object.json-depth-0 > .json-row { grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); }
  .json-object:not(.json-depth-0) > .json-row { grid-template-columns: minmax(0, 1fr); gap: 3px; padding: 6px 0; }
  .json-key { color: #596879; font-size: 12px; font-weight: 750; overflow-wrap: anywhere; }
  .json-value { min-width: 0; font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .json-object { margin: 3px 0 5px; }
  .json-object.json-depth-0 { padding-left: 0; border-left: 0; }
  .json-object:not(.json-depth-0) {
    margin: 5px 0;
    padding: 6px 8px;
    border: 1px solid #cfdfed;
    border-left: 4px solid #6798c6;
    border-radius: 5px;
    background: #f6faff;
  }
  .json-object.json-depth-2 { border-color: #cce3d6; border-left-color: #62a17e; background: #f5fbf7; }
  .json-object.json-depth-3 { border-color: #eadcbf; border-left-color: #b58b3f; background: #fdfaf3; }
  .json-object.json-depth-4 { border-color: #ded4eb; border-left-color: #8c6bb1; background: #faf7fd; }
  .json-object.json-depth-5 { border-color: #ecd2d8; border-left-color: #b96f7f; background: #fdf7f8; }
  .json-object.json-depth-6 { border-color: #d5dce3; border-left-color: #758493; background: #f8fafb; }
  .json-object:not(.json-depth-0) > .json-row > .json-key {
    width: fit-content;
    max-width: 100%;
    padding: 1px 6px;
    border-radius: 3px;
    color: #315d89;
    background: #edf5fc;
    font-size: 11px;
  }
  .json-object.json-depth-2 > .json-row > .json-key { color: #356b51; background: #edf7f1; }
  .json-object.json-depth-3 > .json-row > .json-key { color: #765b2a; background: #faf5e9; }
  .json-object.json-depth-4 > .json-row > .json-key { color: #62477e; background: #f2ecf8; }
  .json-object.json-depth-5 > .json-row > .json-key { color: #854b58; background: #f9ecef; }
  .json-object.json-depth-6 > .json-row > .json-key { color: #52606d; background: #eef1f4; }
  .json-array { display: grid; gap: 7px; }
  .json-array:not(.json-depth-0) { padding-left: 8px; }
  .array-item { min-width: 0; padding: 7px 8px; border-left: 3px solid #7ea7cf; background: #f8fafb; }
  .json-array.json-depth-2 > .array-item { border-left-color: #77aa91; }
  .json-array.json-depth-3 > .array-item { border-left-color: #b49a68; }
  .json-array.json-depth-4 > .array-item { border-left-color: #8c6bb1; background: #faf7fd; }
  .json-array.json-depth-5 > .array-item { border-left-color: #b96f7f; background: #fdf7f8; }
  .json-array.json-depth-6 > .array-item { border-left-color: #758493; }
  .messages { display: grid; gap: 8px; }
  .message { min-width: 0; border-top: 1px solid var(--line); padding-top: 8px; }
  .message:first-child { border-top: 0; }
  .message-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 7px; }
  .role { padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .role-system { color: #344256; background: #e7ecf1; }
  .role-user { color: #174b85; background: #dcecff; }
  .role-assistant { color: #056044; background: #d9f5e9; }
  .role-tool { color: #8c4d00; background: #fff0d5; }
  .content-block { min-width: 0; margin-top: 7px; padding: 8px 9px; border-left: 3px solid #b8c4d0; background: #fafbfc; }
  .content-block.reasoning { border-left-color: #d97706; background: #fff8ed; }
  .content-block.tool { border-left-color: #7257b5; background: #f7f4ff; }
  .block-title { margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  details.raw > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .empty, .loading { padding: 34px 20px; text-align: center; color: var(--muted); }
  .error { padding: 12px; color: var(--red); background: #fff1f0; border: 1px solid #f1b8b3; }
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; }
    .sample-list { max-height: 340px; }
  }
  @media (min-width: 901px) and (max-width: 1200px) {
    .json-object.json-depth-0 > .json-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  }
</style>
</head>
<body>
<header>
  <h1>Paper Reasoning Trace Viewer <span class="build">paper-v1</span></h1>
  <div class="toolbar">
    <div class="control"><label for="regime">Visibility</label><select id="regime"></select></div>
    <div class="control"><label for="task">Task</label><select id="task"></select></div>
    <div class="control"><label for="condition">Experiment condition</label><select id="condition"></select></div>
    <button id="refresh">Refresh</button>
  </div>
</header>
<main>
  <div class="layout">
    <aside>
      <div class="aside-head"><span>Test samples</span><span id="count" class="tag">0</span></div>
      <div class="filters">
        <input id="search" type="text" placeholder="Search index, prediction, SMILES, summary">
        <select id="correctness">
          <option value="">All outcomes</option>
          <option value="correct">Correct</option>
          <option value="wrong">Wrong</option>
        </select>
        <select id="status">
          <option value="">All statuses</option>
          <option value="ok">OK</option>
          <option value="failed">Failed</option>
        </select>
      </div>
      <div id="samples" class="sample-list"><div class="loading">Scanning paper runs...</div></div>
    </aside>
    <section id="detail" class="detail"><div class="section"><div class="empty">Select a paper experiment.</div></div></section>
  </div>
</main>
<script>
const ROOTS = [
  { id: "runs", label: "Identity-blind" },
  { id: "runs_deployment_visible_prefetched", label: "Deployment-visible (matched prefetch)" },
  { id: "runs_deployment_visible", label: "Deployment-visible (agentic tools)" },
  { id: "runs_deployment_visible_parent_disjoint", label: "Deployment-visible (parent-disjoint)" },
];
const state = { catalog: [], condition: null, manifest: null, predictions: [], filtered: [], selected: null, trace: [], retrieval: null, runManifest: null, reuse: null, loading: false };
const $ = id => document.getElementById(id);
const els = { regime: $("regime"), task: $("task"), condition: $("condition"), refresh: $("refresh"), search: $("search"), correctness: $("correctness"), status: $("status"), samples: $("samples"), count: $("count"), detail: $("detail") };

function esc(value) {
  return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
function text(value) {
  if (value == null) return "";
  if (typeof value === "string") return value;
  try { return JSON.stringify(value, null, 2); } catch { return String(value); }
}
function joinPath(...parts) { return parts.filter(Boolean).map(x => String(x).replace(/^\/+|\/+$/g, "")).join("/"); }
function dirname(path) { return String(path).replace(/\/[^/]*$/, ""); }
function normalizePaperPath(path) {
  const raw = String(path || "").replaceAll("\\", "/");
  const marker = "outputs/paper/molecular_evidence_agent/";
  const index = raw.indexOf(marker);
  return (index >= 0 ? raw.slice(index + marker.length) : raw).replace(/^\/+/, "");
}
async function fetchText(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(`HTTP ${response.status}: ${path}`);
  return response.text();
}
async function fetchJson(path) { return JSON.parse(await fetchText(path)); }
async function fetchJsonOptional(path) { try { return await fetchJson(path); } catch { return null; } }
async function exists(path) { try { const r = await fetch(path, { method: "HEAD", cache: "no-store" }); return r.ok; } catch { return false; } }
function parseJsonl(source) { return source.split(/\r?\n/).filter(line => line.trim()).map(line => JSON.parse(line)); }
async function listDirectories(path) {
  const html = await fetchText(`${path.replace(/\/$/, "")}/`);
  const doc = new DOMParser().parseFromString(html, "text/html");
  const values = [];
  for (const anchor of doc.querySelectorAll("a[href]")) {
    const href = anchor.getAttribute("href") || "";
    if (!href.endsWith("/") || href === "../" || href.startsWith("?")) continue;
    const name = decodeURIComponent(href.replace(/\/$/, "").split("/").filter(Boolean).pop() || "");
    if (!name || name.startsWith("." ) || name.startsWith("_")) continue;
    values.push({ name, path: joinPath(path, name) });
  }
  return values;
}

async function scanCatalog() {
  setLoading(true, "Scanning final paper conditions...");
  const catalog = [];
  for (const root of ROOTS) {
    if (!(await exists(`${root.id}/`))) continue;
    for (const task of await listDirectories(root.id)) {
      for (const condition of await listDirectories(task.path)) {
        if (await exists(`${condition.path}/predictions.jsonl`)) {
          catalog.push({ regime: root.id, regimeLabel: root.label, task: task.name, name: condition.name, path: condition.path });
        }
      }
    }
  }
  state.catalog = catalog.sort((a, b) => `${a.regime}/${a.task}/${a.name}`.localeCompare(`${b.regime}/${b.task}/${b.name}`));
  populateRegimes();
  setLoading(false);
  if (state.catalog.length) await loadSelectedCondition();
  else showError("No final paper conditions with predictions.jsonl were found.");
}
function populateRegimes() {
  const regimes = ROOTS.filter(root => state.catalog.some(item => item.regime === root.id));
  els.regime.innerHTML = regimes.map(root => `<option value="${esc(root.id)}">${esc(root.label)}</option>`).join("");
  populateTasks();
}
function populateTasks() {
  const tasks = [...new Set(state.catalog.filter(x => x.regime === els.regime.value).map(x => x.task))].sort();
  els.task.innerHTML = tasks.map(task => `<option value="${esc(task)}">${esc(task)}</option>`).join("");
  populateConditions();
}
function populateConditions() {
  const conditions = state.catalog.filter(x => x.regime === els.regime.value && x.task === els.task.value);
  els.condition.innerHTML = conditions.map(item => `<option value="${esc(item.path)}">${esc(item.name)}</option>`).join("");
}
async function loadSelectedCondition() {
  const condition = state.catalog.find(x => x.path === els.condition.value);
  if (!condition) return;
  setLoading(true, `Loading ${condition.name}...`);
  try {
    const [predictions, manifest] = await Promise.all([
      fetchText(`${condition.path}/predictions.jsonl`).then(parseJsonl),
      fetchJsonOptional(`${condition.path}/manifest.json`),
    ]);
    state.condition = condition;
    state.manifest = manifest;
    state.predictions = predictions;
    state.selected = null;
    state.runManifest = null;
    state.reuse = null;
    applyFilters();
    if (state.filtered.length) await selectSample(state.filtered[0]);
    else renderEmpty("This condition has no prediction rows.");
  } catch (error) {
    showError(error.message);
  } finally {
    setLoading(false);
  }
}
function rowSearchText(row) {
  return [row.query_index, row.smiles, row.label, row.pred_label, row.confidence, row.final_summary, row.status, row.final_status].map(text).join(" ").toLowerCase();
}
function applyFilters() {
  const query = els.search.value.trim().toLowerCase();
  const correctness = els.correctness.value;
  const status = els.status.value;
  state.filtered = state.predictions.filter(row => {
    const okStatus = String(row.status || row.final_status || "").toLowerCase() === "ok";
    if (query && !rowSearchText(row).includes(query)) return false;
    if (correctness === "correct" && row.correct !== true) return false;
    if (correctness === "wrong" && row.correct !== false) return false;
    if (status === "ok" && !okStatus) return false;
    if (status === "failed" && okStatus) return false;
    return true;
  });
  renderSampleList();
}
function renderSampleList() {
  els.count.textContent = `${state.filtered.length} / ${state.predictions.length}`;
  if (!state.filtered.length) { els.samples.innerHTML = '<div class="empty">No matching samples.</div>'; return; }
  els.samples.innerHTML = state.filtered.map(row => {
    const active = state.selected && row.query_index === state.selected.query_index ? " active" : "";
    const outcome = row.correct === true ? '<span class="ok">correct</span>' : row.correct === false ? '<span class="bad">wrong</span>' : '<span class="warn">unknown</span>';
    const prediction = row.pred_label ?? "";
    return `<button class="sample${active}" data-index="${esc(row.query_index)}">
      <div class="sample-main"><strong>#${esc(row.query_index)}</strong>${outcome}</div>
      <div class="sample-sub">label=${esc(row.label)} prediction=${esc(prediction)} confidence=${esc(row.confidence || "")}</div>
      <div class="sample-sub">${esc(row.smiles || "")}</div>
    </button>`;
  }).join("");
  els.samples.querySelectorAll(".sample").forEach(button => {
    button.onclick = () => {
      const row = state.predictions.find(item => String(item.query_index) === button.dataset.index);
      if (row) selectSample(row);
    };
  });
}
async function selectSample(row) {
  state.selected = row;
  renderSampleList();
  renderLoadingDetail(`Loading sample #${row.query_index}...`);
  try {
    let tracePath = normalizePaperPath(row.trace_messages);
    if (!tracePath && row.run_dir) tracePath = `${normalizePaperPath(row.run_dir)}/trace_messages.jsonl`;
    if (!tracePath) throw new Error("Prediction row does not contain a trace path.");
    const runRoot = dirname(tracePath);
    const [trace, retrieval, runManifest, reuse] = await Promise.all([
      fetchText(tracePath).then(parseJsonl),
      fetchJsonOptional(`${runRoot}/retrieval.json`),
      fetchJsonOptional(`${runRoot}/manifest.json`),
      fetchJsonOptional(`${runRoot}/reuse.json`),
    ]);
    state.trace = trace;
    state.retrieval = retrieval;
    state.runManifest = runManifest;
    state.reuse = reuse;
    renderDetail();
  } catch (error) {
    showError(error.message);
  }
}

function setLoading(value, message = "") {
  state.loading = value;
  els.refresh.disabled = value;
  if (value && message) els.samples.innerHTML = `<div class="loading">${esc(message)}</div>`;
}
function renderLoadingDetail(message) { els.detail.innerHTML = `<div class="section"><div class="loading">${esc(message)}</div></div>`; }
function renderEmpty(message) { els.detail.innerHTML = `<div class="section"><div class="empty">${esc(message)}</div></div>`; }
function showError(message) { els.detail.innerHTML = `<div class="error">${esc(message)}</div>`; }
function statusClass(value) { return String(value).toLowerCase() === "ok" ? "ok" : "bad"; }
function metric(key, value) { return `<div class="metric"><div class="metric-key">${esc(key)}</div><div class="metric-value">${esc(text(value))}</div></div>`; }
function usageText(usage) {
  if (!usage) return "";
  return `${Number(usage.prompt_tokens || 0).toLocaleString()} in / ${Number(usage.completion_tokens || 0).toLocaleString()} out / ${Number(usage.total_tokens || 0).toLocaleString()} total`;
}
function stageLabel(task) {
  if (task === "single_molecule") return "Single-molecule prior";
  if (task === "final_summary") return "Final synthesis";
  if (task === "Flat.all_evidence") return "Flat evidence reasoning";
  return task;
}
function parseMaybeJson(value) {
  if (value && typeof value === "object") return value;
  if (typeof value !== "string") return null;
  const trimmed = value.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
  if (!trimmed || !["{", "["].includes(trimmed[0])) return null;
  try { return JSON.parse(trimmed); } catch { return null; }
}
function renderValue(value, depth = 0) {
  if (value == null) return '<span class="json-value"></span>';
  const depthClass = depth === 0 ? "json-depth-0" : `json-depth-${((depth - 1) % 6) + 1}`;
  if (Array.isArray(value)) {
    if (!value.length) return '<span class="json-value">[]</span>';
    return `<div class="json-array ${depthClass}">${value.map((item, index) => `<div class="array-item"><div class="tag">#${index + 1}</div>${renderValue(item, depth + 1)}</div>`).join("")}</div>`;
  }
  if (typeof value === "object") {
    return `<div class="json-object ${depthClass}">${Object.entries(value).map(([key, item]) => `<div class="json-row"><div class="json-key">${esc(key)}</div><div class="json-value">${renderValue(item, depth + 1)}</div></div>`).join("")}</div>`;
  }
  return `<span class="json-value">${esc(String(value))}</span>`;
}
function renderResponse(record) {
  const parsed = parseMaybeJson(record.response_text);
  if (parsed) return renderValue(parsed);
  return `<pre>${esc(record.response_text || "")}</pre>`;
}
function renderMessage(message, index) {
  const role = message.role || "item";
  const blocks = [];
  if (message.reasoning) blocks.push(`<div class="content-block reasoning"><div class="block-title">Reasoning</div><pre>${esc(message.reasoning)}</pre></div>`);
  if (message.content && role !== "tool") {
    const parsed = parseMaybeJson(message.content);
    blocks.push(`<div class="content-block"><div class="block-title">Content</div>${parsed ? renderValue(parsed) : `<pre>${esc(message.content)}</pre>`}</div>`);
  }
  if (Array.isArray(message.tool_calls)) {
    for (const call of message.tool_calls) blocks.push(`<div class="content-block tool"><div class="block-title">Tool call: ${esc(call.function?.name || call.name || call.id || "tool")}</div>${renderValue(call)}</div>`);
  }
  if (role === "tool") blocks.push(`<div class="content-block tool"><div class="block-title">Tool result</div><pre>${esc(message.content || text(message))}</pre></div>`);
  return `<div class="message"><div class="message-head"><span class="role role-${esc(role)}">${esc(role)}</span><span class="tag">#${index + 1}</span>${message.name ? `<span class="tag">${esc(message.name)}</span>` : ""}</div>${blocks.join("")}<details class="raw"><summary>Raw message JSON</summary><pre>${esc(JSON.stringify(message, null, 2))}</pre></details></div>`;
}
function renderStage(record, index, total) {
  const open = record.task === "final_summary" || total <= 3 ? " open" : "";
  return `<details class="stage"${open}><summary><span>${esc(stageLabel(record.task))}</span><span class="${statusClass(record.status)}">${esc(record.status || "unknown")}</span></summary><div class="stage-content">
    <div class="stage-meta"><span class="pill">tools ${esc(record.tool_count || 0)}</span><span class="pill">${esc(usageText(record.usage))}</span></div>
    <div>${renderResponse(record)}</div>
    <details class="raw"><summary>Complete prompt, reasoning, tool calls and responses</summary><div class="messages">${(record.messages || []).map(renderMessage).join("") || '<div class="empty">No messages.</div>'}</div></details>
    <details class="raw"><summary>Raw trace record</summary><pre>${esc(JSON.stringify(record, null, 2))}</pre></details>
  </div></details>`;
}
function renderRetrieval(retrieval) {
  if (!retrieval) return "";
  const groups = Array.isArray(retrieval.groups) ? retrieval.groups : [];
  const header = [
    metric("Status", retrieval.status),
    metric("Source", retrieval.experiment?.source || retrieval.evidence_source?.type || ""),
    metric("Mode", retrieval.experiment?.mode || ""),
    metric("Groups", groups.length),
    metric("Coverage", retrieval.coverage || ""),
  ].join("");
  const body = groups.map(renderRetrievalGroup).join("");
  return `<div class="section"><div class="section-head"><span>Retrieved evidence</span><span class="tag">minimal_evidence.v1 compatible</span></div><div class="overview">${header}</div>${body}<details class="stage"><summary><span>Raw retrieval JSON</span><span class="tag">provenance</span></summary><div class="stage-content"><pre>${esc(JSON.stringify(retrieval, null, 2))}</pre></div></details></div>`;
}
function renderRetrievalGroup(group) {
  const neighbors = Array.isArray(group.neighbors) ? group.neighbors : [];
  const meta = Object.fromEntries(Object.entries(group).filter(([key]) => key !== "neighbors"));
  return `<details class="stage"><summary><span>${esc(group.group_id || group.endpoint_group || "group")}</span><span class="tag">${neighbors.length} neighbors</span></summary><div class="stage-content">${renderValue(meta)}${neighbors.map(renderNeighbor).join("")}</div></details>`;
}
function renderNeighbor(neighbor) {
  const evidence = Array.isArray(neighbor.evidence_rows) ? neighbor.evidence_rows : [];
  const id = neighbor.molecule_chembl_id || neighbor.source_molecule_id || neighbor.molecule_id || "neighbor";
  const meta = Object.fromEntries(Object.entries(neighbor).filter(([key]) => key !== "evidence_rows"));
  return `<details class="raw"><summary>rank ${esc(neighbor.rank || "")} · ${esc(id)} · similarity ${esc(neighbor.similarity ?? "")} · ${evidence.length} evidence rows</summary><div class="json">${renderValue(meta)}${evidence.map(renderEvidenceRow).join("")}</div></details>`;
}
function renderEvidenceRow(row, index) {
  const measurement = [row.standard_type || row.endpoint?.name || "evidence", row.standard_relation, row.standard_value, row.standard_units].filter(value => value !== null && value !== undefined && value !== "").join(" ");
  return `<details class="raw"><summary>#${index + 1} ${esc(measurement)}</summary><pre>${esc(JSON.stringify(row, null, 2))}</pre></details>`;
}
function renderReuseProvenance(reuse) {
  if (!reuse) return "";
  const values = [
    metric("Reuse reason", reuse.reuse_reason || ""),
    metric("Baseline input hash", reuse.baseline_prompt_hash || ""),
    metric("Target input hash", reuse.target_prompt_hash || ""),
    metric("Reused from", reuse.reused_from || ""),
  ].join("");
  return `<div class="section"><div class="section-head"><span>Parent-disjoint artifact reuse</span><span class="tag">identical LLM-visible input</span></div><div class="overview">${values}</div><details class="stage"><summary><span>Raw reuse provenance</span><span class="tag">reuse.json</span></summary><div class="stage-content"><pre>${esc(JSON.stringify(reuse, null, 2))}</pre></div></details></div>`;
}
function renderDetail() {
  const row = state.selected;
  if (!row) return renderEmpty("Select a test sample.");
  const final = state.trace.find(record => record.task === "final_summary") || state.trace.find(record => record.prediction);
  const neighborPolicy = state.runManifest?.neighbor_identity_policy || state.manifest?.neighbor_identity_policy || state.retrieval?.experiment?.neighbor_identity_policy || "not recorded";
  const parentDisjointExecution = state.condition?.regime === "runs_deployment_visible_parent_disjoint"
    ? (state.reuse ? "reused (retrieval input unchanged)" : "rerun (retrieval changed)")
    : "not applicable";
  const totalUsage = state.trace.reduce((sum, record) => {
    sum.prompt += Number(record.usage?.prompt_tokens || 0);
    sum.completion += Number(record.usage?.completion_tokens || 0);
    sum.total += Number(record.usage?.total_tokens || 0);
    return sum;
  }, { prompt: 0, completion: 0, total: 0 });
  const overview = [
    metric("Task", state.condition?.task),
    metric("Condition", state.condition?.name),
    metric("Visibility", state.condition?.regimeLabel),
    metric("Neighbor policy", neighborPolicy),
    metric("Parent-disjoint execution", parentDisjointExecution),
    metric("Index", row.query_index),
    metric("Label", row.label),
    metric("Prediction", final?.prediction ?? row.pred_label),
    metric("Correct", row.correct),
    metric("Confidence", row.confidence || parseMaybeJson(final?.response_text)?.confidence || ""),
    metric("Stages", state.trace.length),
    metric("Tokens", `${totalUsage.prompt.toLocaleString()} in / ${totalUsage.completion.toLocaleString()} out / ${totalUsage.total.toLocaleString()} total`),
    metric("SMILES", row.smiles || ""),
  ].join("");
  const stages = state.trace.map((record, index) => renderStage(record, index, state.trace.length)).join("");
  const pills = state.trace.map(record => `<span class="pill ${statusClass(record.status)}">${esc(stageLabel(record.task))}</span>`).join("");
  els.detail.innerHTML = `<div class="section"><div class="section-head"><span>Sample overview</span><span class="tag">${esc(row.run_id || "")}</span></div><div class="overview">${overview}</div><div class="stage-nav">${pills}</div></div>${renderReuseProvenance(state.reuse)}${renderRetrieval(state.retrieval)}<div class="section"><div class="section-head"><span>Reasoning stages</span><span class="tag">single -> group(s) -> final</span></div>${stages}</div>`;
}

els.regime.onchange = () => { populateTasks(); loadSelectedCondition(); };
els.task.onchange = () => { populateConditions(); loadSelectedCondition(); };
els.condition.onchange = loadSelectedCondition;
els.refresh.onclick = scanCatalog;
els.search.oninput = applyFilters;
els.correctness.onchange = applyFilters;
els.status.onchange = applyFilters;
scanCatalog().catch(error => showError(error.message));
</script>
</body>
</html>
