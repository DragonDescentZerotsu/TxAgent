<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Reasoning Trace Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f7f8fa; color: #1f2937; }
  header { position: sticky; top: 0; z-index: 5; background: #1f2937; color: white; padding: 12px 18px; box-shadow: 0 2px 8px rgba(0,0,0,.16); }
  h1 { margin: 0 0 10px; font-size: 18px; }
  .viewer-build { margin-left: 8px; color: #93c5fd; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  label { font-size: 12px; color: #d1d5db; margin-right: 4px; }
  select, input, button { font: inherit; font-size: 13px; border-radius: 5px; }
  select, input { background: #374151; color: white; border: 1px solid #566174; padding: 6px 8px; }
  input[type="text"] { width: min(560px, 90vw); }
  button { border: 0; padding: 7px 12px; background: #2563eb; color: white; cursor: pointer; }
  main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; }
  .panel { background: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .panel-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; background: #eef1f5; border-bottom: 1px solid #e1e5eb; font-weight: 650; font-size: 13px; }
  .panel-body { padding: 12px; }
  .filters { display: grid; gap: 8px; margin-bottom: 10px; }
  .filters input, .filters select { width: 100%; background: white; color: #111827; border: 1px solid #d1d5db; }
  .cost-controls { border: 1px solid #e5e7eb; border-radius: 7px; padding: 8px; background: #f8fafc; display: grid; gap: 7px; }
  .cost-title { display: flex; justify-content: space-between; gap: 8px; color: #374151; font-size: 12px; font-weight: 750; }
  .cost-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .cost-grid label { display: grid; gap: 3px; color: #4b5563; font-size: 10px; font-weight: 700; }
  .cost-grid input { width: 100%; padding: 5px 6px; font-size: 12px; }
  .cost-summary { color: #4b5563; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .list { max-height: calc(100vh - 245px); overflow: auto; }
  .item { width: 100%; text-align: left; background: white; color: #111827; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; margin-bottom: 7px; cursor: pointer; }
  .item.active { border-color: #2563eb; box-shadow: inset 3px 0 0 #2563eb; }
  .item-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; font-size: 13px; }
  .item-sub { margin-top: 4px; color: #5b6472; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok { color: #047857; font-weight: 750; }
  .bad { color: #b91c1c; font-weight: 750; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .field { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; min-width: 0; }
  .response-full { margin-top: 10px; border: 1px solid #e5e7eb; border-radius: 7px; overflow: hidden; background: white; }
  .response-full > .block { border-top: 0; }
  .k { color: #697386; text-transform: uppercase; font-size: 10px; font-weight: 750; letter-spacing: .05em; }
  .v { margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; word-break: break-word; white-space: pre-wrap; }
  .trace { display: grid; gap: 12px; }
  .package-grid { display: grid; gap: 12px; margin-bottom: 14px; }
  .stage-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: #f1f5f9; border: 1px solid #dbe3ef; color: #334155; font-size: 11px; font-weight: 750; }
  .stage-pill.ok { background: #ecfdf5; border-color: #bbf7d0; color: #047857; }
  .stage-pill.bad { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .stage-panel { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: #ffffff; }
  .stage-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 11px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; font-size: 13px; font-weight: 750; }
  .stage-body { padding: 10px; display: grid; gap: 10px; }
  .stage-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .compact-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .compact-table th, .compact-table td { text-align: left; vertical-align: top; border-bottom: 1px solid #edf0f4; padding: 6px 7px; }
  .compact-table th { color: #64748b; background: #f8fafc; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .group-output-card { border: 1px solid #dbe3ef; border-radius: 7px; background: #f8fafc; overflow: hidden; }
  .group-output-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-bottom: 1px solid #e2e8f0; }
  .raw-details { border-top: 1px solid #eef2f7; padding-top: 7px; }
  .message { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
  .message-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
  .role { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; }
  .role-system { background: #e5e7eb; color: #374151; }
  .role-user { background: #dbeafe; color: #1e40af; }
  .role-assistant { background: #d1fae5; color: #065f46; }
  .role-tool { background: #ffedd5; color: #9a3412; }
  .tag { color: #566174; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .block { padding: 10px; border-top: 1px solid #f0f2f5; }
  .block:first-child { border-top: 0; }
  .block-title { margin-bottom: 6px; color: #4b5563; font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
  .reasoning { background: #fff7ed; border-left: 3px solid #f97316; }
  .tool-call { background: #f5f3ff; border-left: 3px solid #8b5cf6; }
  .tool-result { background: #fefce8; border-left: 3px solid #eab308; }
  .json-view { display: grid; gap: 10px; }
  .json-section { border: 1px solid #e5e7eb; border-radius: 7px; overflow: hidden; background: #ffffff; }
  .json-section > .json-title { padding: 7px 9px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; font-weight: 750; font-size: 12px; color: #374151; }
  .json-body { padding: 9px; display: grid; gap: 7px; }
  .kv { display: grid; grid-template-columns: minmax(110px, 230px) minmax(0, 1fr); gap: 8px; align-items: start; }
  .kv-key { color: #6b7280; font-weight: 700; font-size: 12px; }
  .kv-val { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  .json-list { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
  .neighbor-card { border: 1px solid #dbe3ef; border-radius: 7px; padding: 8px; background: #f8fafc; display: grid; gap: 7px; }
  .key-evidence-card { background: #ffffff; border-color: #cbd5e1; }
  .evidence-card { border-left: 3px solid #94a3b8; padding: 9px 10px; background: white; display: grid; gap: 8px; }
  .evidence-measurement { display: flex; flex-wrap: wrap; gap: 7px; align-items: baseline; }
  .evidence-measurement strong { font-size: 14px; }
  .evidence-summary { padding: 8px; border-radius: 6px; background: #eefbf5; border: 1px solid #ccebdd; }
  .evidence-summary-title { color: #166534; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .evidence-provenance { padding: 8px; border-radius: 6px; background: #f8fafc; border: 1px solid #e2e8f0; display: grid; gap: 6px; }
  .evidence-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.48; }
  .evidence-subtitle { color: #64748b; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-size: 11px; font-weight: 750; margin-right: 5px; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.52 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  details summary { cursor: pointer; color: #4b5563; font-size: 12px; }
  .empty { padding: 28px; text-align: center; color: #6b7280; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .list { max-height: 320px; } }
</style>
</head>
<body>
<header>
  <h1>Reasoning Trace Viewer <span class="viewer-build">build 20260622-bioavailability-v2-final-prompt</span></h1>
  <div class="bar">
    <div><label>run</label><select id="runSelect"><option>Scanning...</option></select></div>
    <button id="loadBtn">Load trace</button>
    <button id="refreshBtn">Refresh</button>
    <div><label>path</label><input id="pathInput" type="text" placeholder="run_id/trace_messages.jsonl"><button id="pathBtn">Load</button></div>
    <div><label>file</label><input id="fileInput" type="file" accept=".jsonl,.txt"></div>
  </div>
</header>
<main>
  <div class="layout">
    <aside class="panel">
      <div class="panel-title"><span>Analyses</span><span id="count" class="tag">0 shown</span></div>
      <div class="panel-body">
        <div class="filters">
          <select id="moleculeFilter">
            <option value="">All molecule packages</option>
          </select>
          <input id="search" type="text" placeholder="Search task, message, tool result">
          <select id="toolFilter">
            <option value="">All records</option>
            <option value="tools">Has tool calls</option>
            <option value="no-tools">No tool calls</option>
          </select>
          <div class="cost-controls">
            <div class="cost-title"><span>Cost estimate</span><span>USD / 1M tokens</span></div>
            <div class="cost-grid">
              <label>cache hit<input id="priceCacheHit" type="number" step="0.000001" value="0.003625"></label>
              <label>cache miss<input id="priceCacheMiss" type="number" step="0.001" value="0.435"></label>
              <label>output<input id="priceOutput" type="number" step="0.001" value="0.87"></label>
            </div>
            <div id="costSummary" class="cost-summary">Load trace to estimate cost.</div>
          </div>
        </div>
        <div id="list" class="list"></div>
      </div>
    </aside>
    <section id="detail"></section>
  </div>
</main>
<script>
const state = { records: [], filtered: [], selected: 0, runs: [], moleculeKey: "", packageCache: new Map() };
const els = {
  runSelect: document.getElementById("runSelect"),
  loadBtn: document.getElementById("loadBtn"),
  refreshBtn: document.getElementById("refreshBtn"),
  pathInput: document.getElementById("pathInput"),
  pathBtn: document.getElementById("pathBtn"),
  fileInput: document.getElementById("fileInput"),
  moleculeFilter: document.getElementById("moleculeFilter"),
  search: document.getElementById("search"),
  toolFilter: document.getElementById("toolFilter"),
  priceCacheHit: document.getElementById("priceCacheHit"),
  priceCacheMiss: document.getElementById("priceCacheMiss"),
  priceOutput: document.getElementById("priceOutput"),
  costSummary: document.getElementById("costSummary"),
  list: document.getElementById("list"),
  detail: document.getElementById("detail"),
  count: document.getElementById("count"),
};
function esc(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function str(v){ if(v==null) return ""; if(typeof v==="string") return v; try{return JSON.stringify(v,null,2)}catch{return String(v)} }
function parseJsonl(text, source){ return text.split(/\r?\n/).filter(x=>x.trim()).map((line,i)=>{ const r=JSON.parse(line); r.__source=source; r.__id=`${source}:${i}:${r.task}`; return r; }); }
function moleculeKey(r){ return r.molecule_key || `index:${r.index ?? r.sample_id ?? "unknown"}|${r.smiles || ""}`; }
function moleculeLabel(key, records){
  const r = records[0] || {};
  const index = r.index ?? r.sample_id ?? "unknown";
  const label = r.label == null ? "" : ` label=${r.label}`;
  const pred = records.find(x=>x.prediction)?.prediction;
  const predText = pred ? ` prediction=${pred}` : "";
  const smiles = r.smiles ? ` ${String(r.smiles).slice(0, 72)}` : "";
  return `molecule #${index}${label}${predText} · ${records.length} traces${smiles}`;
}
function moleculeGroups(){
  const groups = new Map();
  for(const r of state.records){
    const key = moleculeKey(r);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  return groups;
}
function updateMoleculeFilter(){
  const groups = moleculeGroups();
  const options = ['<option value="">All molecule packages</option>'];
  for(const [key, records] of groups.entries()) options.push(`<option value="${esc(key)}">${esc(moleculeLabel(key, records))}</option>`);
  els.moleculeFilter.innerHTML = options.join("");
  if(state.moleculeKey && groups.has(state.moleculeKey)) {
    els.moleculeFilter.value = state.moleculeKey;
  } else {
    state.moleculeKey = "";
    els.moleculeFilter.value = "";
  }
}
async function scanRuns(){
  const res = await fetch("./"); const html = await res.text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const runs = [];
  for(const a of doc.querySelectorAll("a[href]")){
    const href = a.getAttribute("href");
    if(!href || href === "../" || !href.endsWith("/")) continue;
    const name = decodeURIComponent(href.replace(/\/$/,""));
    if(name.startsWith(".") || name === "__pycache__") continue;
    try {
      const head = await fetch(`${href}trace_messages.jsonl`, {method:"HEAD"});
      if(head.ok) runs.push({name, path:`${href}trace_messages.jsonl`});
    } catch {}
  }
  state.runs = runs.sort((a,b)=>b.name.localeCompare(a.name));
  els.runSelect.innerHTML = state.runs.length ? state.runs.map(r=>`<option value="${esc(r.path)}">${esc(r.name)}</option>`).join("") : "<option>No traces found</option>";
}
async function loadPath(path){
  const clean = path.trim().replace(/^\/+/,"");
  const res = await fetch(clean); if(!res.ok) throw new Error(`HTTP ${res.status}: ${clean}`);
  state.records = parseJsonl(await res.text(), clean);
  state.selected = 0; state.moleculeKey = ""; state.packageCache = new Map(); updateMoleculeFilter(); apply();
}
function addRecords(records){ state.records = records; state.selected = 0; state.moleculeKey = ""; state.packageCache = new Map(); updateMoleculeFilter(); apply(); }
function recordText(r){ return [r.task,r.smiles,r.response_text,str(r.messages),str(r.raw_output)].join("\n").toLowerCase(); }
function hasTools(r){ return Number(r.tool_count||0)>0 || (Array.isArray(r.messages) && r.messages.some(m=>m.role==="tool" || (m.tool_calls||[]).length)); }
function apply(){
  const q = els.search.value.trim().toLowerCase(), tf = els.toolFilter.value;
  const mk = state.moleculeKey;
  state.filtered = state.records.filter(r => (!mk || moleculeKey(r) === mk) && (!q || recordText(r).includes(q)) && (tf !== "tools" || hasTools(r)) && (tf !== "no-tools" || !hasTools(r)));
  if(!state.filtered.includes(state.records[state.selected])) state.selected = state.records.indexOf(state.filtered[0]);
  renderList(); renderDetail(); renderCostSummary(); els.count.textContent = `${state.filtered.length} shown`;
}
function renderList(){
  if(!state.filtered.length){ els.list.innerHTML = '<div class="empty">No records loaded.</div>'; return; }
  els.list.innerHTML = state.filtered.map(r=>{
    const active = state.records[state.selected]?.__id === r.__id ? " active" : "";
    return `<button class="item${active}" data-id="${esc(r.__id)}">
      <div class="item-title"><span>${esc(r.task)}</span><span class="${r.status==="ok"?"ok":"bad"}">${esc(r.status)}</span></div>
      <div class="item-sub">molecule=${esc(r.index ?? r.sample_id ?? "")} · tools=${esc(r.tool_count)} · cost=${esc(formatCost(estimateCost(r.usage).total))} · usage=${esc(formatUsage(r.usage))}</div>
      <div class="item-sub">${esc(r.smiles)}</div>
    </button>`;
  }).join("");
  els.list.querySelectorAll(".item").forEach(btn => btn.onclick = () => { state.selected = state.records.findIndex(r=>r.__id===btn.dataset.id); renderList(); renderDetail(); });
}
function renderDetail(){
  const r = state.records[state.selected];
  if(!r){ els.detail.innerHTML = '<div class="panel"><div class="empty">Load trace_messages.jsonl to begin.</div></div>'; return; }
  const cost = estimateCost(r.usage);
  const packageRecords = recordsForMolecule(r);
  const packageView = renderMoleculePackage(r, packageRecords);
  els.detail.innerHTML = `${packageView}<details class="stage-panel"><summary class="stage-head"><span>Selected Raw Trace Record</span><span class="tag">${esc(r.task)} · ${esc(r.__source)}</span></summary>
    <div class="stage-body"><div class="meta">
      ${field("SMILES", r.smiles)}${field("Label", r.label)}${field("Prediction", r.prediction)}${field("Tools", r.tool_count)}${field("Usage", formatUsage(r.usage))}${field("Estimated cost", formatCostBreakdown(cost))}
    </div>${r.response_text ? `<div class="response-full">${blockSmart("Parsed Response", r.response_text, "")}</div>` : ""}
    <div class="trace">${renderMessages(r.messages)}</div></div></details>`;
}
function field(k,v){ return `<div class="field"><div class="k">${esc(k)}</div><div class="v">${esc(str(v))}</div></div>`; }
function recordsForMolecule(record){
  const key = moleculeKey(record);
  return state.records.filter(r=>moleculeKey(r) === key);
}
function packageCacheKey(record){ return `${record.__source || ""}|${moleculeKey(record)}`; }
function renderMoleculePackage(record, packageRecords){
  const key = packageCacheKey(record);
  const cached = state.packageCache.get(key);
  if(!cached) {
    state.packageCache.set(key, {status:"loading"});
    loadMoleculePackage(record, key).then(pkg=>{
      state.packageCache.set(key, pkg);
      if(state.records[state.selected]?.__id === record.__id) renderDetail();
    }).catch(err=>{
      state.packageCache.set(key, {status:"error", error:String(err?.message || err)});
      if(state.records[state.selected]?.__id === record.__id) renderDetail();
    });
  }
  const pkg = state.packageCache.get(key) || {status:"loading"};
  const finalRecord = packageRecords.find(r=>r.task === "final_summary") || packageRecords.find(r=>r.prediction);
  const packageCost = sumCosts(packageRecords);
  const stagePills = renderStagePills(packageRecords, pkg);
  return `<div class="package-grid">
    <div class="panel"><div class="panel-title"><span>Molecule Package</span><span class="tag">${esc(moleculeKey(record))}</span></div>
      <div class="panel-body">
        <div class="meta">
          ${field("Index", record.index ?? record.sample_id)}
          ${field("Label", record.label)}
          ${field("Final prediction", finalRecord?.prediction ?? "")}
          ${field("Trace calls", packageRecords.length)}
          ${field("Package usage", formatCostBreakdown(packageCost))}
        </div>
        <div style="margin-top:10px" class="stage-strip">${stagePills}</div>
        ${pkg.status === "loading" ? '<div class="empty">Loading v2 sidecar files for this molecule...</div>' : ""}
        ${pkg.status === "error" ? `<div class="empty">Could not load sidecar package: ${esc(pkg.error)}</div>` : ""}
      </div>
    </div>
    ${pkg.status === "ok" ? renderSelectedPackageStage(pkg, record, packageRecords) + renderCompletePackageDetails(pkg, packageRecords) : renderTraceCallOverview(packageRecords)}
  </div>`;
}
function renderStagePills(records, pkg){
  const stages = [];
  const byTask = new Map(records.map(r=>[r.task, r]));
  stages.push(stagePill("retrieval", pkg?.retrieval?.status || pkg?.status));
  stages.push(stagePill("single", byTask.get("single_molecule")?.status || pkg?.single?.status));
  const groupCount = records.filter(r=>String(r.task || "").startsWith("Tier ")).length || (pkg?.groups?.length ?? 0);
  stages.push(`<span class="stage-pill">${esc(groupCount)} groups</span>`);
  stages.push(stagePill("compiler", pkg?.final?.compiled_evidence_summary ? "ok" : ""));
  stages.push(stagePill("final", byTask.get("final_summary")?.status || pkg?.final?.status));
  return stages.join("");
}
function stagePill(label, status){
  const cls = status === "ok" ? " ok" : (status && status !== "loading" ? " bad" : "");
  return `<span class="stage-pill${cls}">${esc(label)}${status ? `: ${esc(status)}` : ""}</span>`;
}
async function loadMoleculePackage(record, key){
  const candidates = candidateRunDirs(record);
  let best = null;
  for(const runDir of candidates) {
    const pkg = await loadPackageFromDir(runDir);
    if(pkg.retrieval || pkg.single || pkg.final || (Array.isArray(pkg.groups) && pkg.groups.length)) {
      best = pkg;
      break;
    }
    best = best || pkg;
  }
  const pkg = best || await loadPackageFromDir(candidates[0] || "");
  return {status:"ok", key, ...pkg};
}
async function loadPackageFromDir(runDir){
  const [manifest, retrieval, single, groups, final] = await Promise.all([
    fetchJsonMaybe(`${runDir}/manifest.json`),
    fetchJsonMaybe(`${runDir}/retrieval.json`),
    fetchJsonMaybe(`${runDir}/single_molecule_reasoning_output.json`),
    fetchJsonlMaybe(`${runDir}/group_reasoning_outputs.jsonl`),
    fetchJsonMaybe(`${runDir}/final_reasoning_output.json`),
  ]);
  const missing = [];
  for(const [name, value] of Object.entries({manifest, retrieval, single, groups, final})) {
    if(value == null) missing.push(name);
  }
  return {runDir, manifest, retrieval, single, groups: groups || [], final, missing};
}
function candidateRunDirs(record){
  const source = String(record.__source || "").replace(/\/trace_messages\.jsonl$/,"");
  if(/\/runs\/[^/]+$/.test(source)) return [source];
  const batchName = basename(source);
  const index = record.index ?? record.sample_id;
  if(index == null || batchName === "") return [source];
  return [source, `${source}/runs/${batchName}_idx${String(index).padStart(5,"0")}`];
}
function basename(path){ return String(path || "").split("/").filter(Boolean).pop() || ""; }
async function fetchJsonMaybe(path){
  try {
    const res = await fetch(path);
    if(!res.ok) return null;
    return await res.json();
  } catch { return null; }
}
async function fetchJsonlMaybe(path){
  try {
    const res = await fetch(path);

}
function renderEvidence(e){
  const tags = [e.assay_chembl_id, e.target_pref_name, e.organism].filter(Boolean).map(esc).join(" · ");
  const measurement = [e.standard_relation, e.standard_value, e.standard_units]
    .filter(v=>v !== null && v !== undefined && v !== "")
    .map(esc).join(" ");
  const sourceStats = [
    ["source records (total)", e.source_record_count],
    ["numeric records", e.source_numeric_record_count],
    ["qualitative/contextual records", e.source_qualitative_record_count],
    ["minimum", formatPercent(e.source_value_min_percent)],
    ["median", formatPercent(e.source_value_median_percent)],
    ["maximum", formatPercent(e.source_value_max_percent)],
  ].filter(([,v])=>v !== null && v !== undefined && v !== "");
  const aggregation = sourceStats.length ? `<div class="evidence-summary">
    <div class="evidence-summary-title">Aggregated Starling evidence</div>
    ${sourceStats.map(([k,v])=>kv(k,v)).join("")}
  </div>` : "";
  const provenance = [
    renderStarlingTransferTool(e.starling_transfer_tool),
    renderSourceRecordExamples(e.source_record_examples),
    renderQualitativeSourceExamples(e.source_qualitative_examples),
    renderEvidenceList("source_molecule_names", e.source_molecule_names),
    renderEvidenceList("source_report_types", e.source_report_types),
    renderEvidenceList("source_support_texts", e.source_support_texts),
  ].filter(Boolean).join("");
  const context = e.assay_description ? `<div>
    <div class="evidence-subtitle">Assay / condition description</div>
    <div class="evidence-text">${esc(e.assay_description)}</div>
  </div>` : "";
  const comment = e.activity_comment ? `<div>
    <div class="evidence-subtitle">Activity comment</div>
    <div class="evidence-text">${esc(e.activity_comment)}</div>
  </div>` : "";
  return `<div class="evidence-card">
    <div class="evidence-measurement"><strong>${esc(e.standard_type ?? "")}</strong><span>${measurement}</span></div>
    ${comment}
    ${aggregation}
    ${context}
    ${provenance ? `<div class="evidence-provenance">${provenance}</div>` : ""}
    ${tags ? `<div class="tag">${tags}</div>` : ""}
    <details><summary>All evidence fields exactly as sent</summary><pre>${esc(JSON.stringify(e,null,2))}</pre></details>
  </div>`;
}
function formatPercent(v){
  return v === null || v === undefined || v === "" ? "" : `${v}%`;
}
function renderEvidenceList(label, values){
  if(!Array.isArray(values) || !values.length) return "";
  return `<div>
    <div class="evidence-subtitle">${esc(label)} (${values.length})</div>
    <ol class="json-list">${values.map(v=>`<li class="evidence-text">${esc(formatInline(v))}</li>`).join("")}</ol>
  </div>`;
}
function renderSourceRecordExamples(examples){
  if(!Array.isArray(examples) || !examples.length) return "";
  return `<div>
    <div class="evidence-subtitle">Condition-linked source records (${examples.length})</div>
    ${examples.map((example, index)=>`<div class="neighbor-card">
      <div><span class="badge">record ${index + 1}</span><strong>Oral bioavailability ${esc(formatPercent(example.oral_bioavailability_value_percent))}</strong></div>
      ${example.condition_text ? `<div class="evidence-text">${esc(example.condition_text)}</div>` : ""}
      ${example.support_text ? kv("support_text", example.support_text) : ""}
    </div>`).join("")}
  </div>`;
}
function renderStarlingTransferTool(tool){
  if(!tool || typeof tool !== "object") return "";
  const scores = Array.isArray(tool.source_example_scores) ? tool.source_example_scores : [];
  const summaryFields = [
    ["model", tool.model],
    ["direction", tool.direction],
    ["query_metadata_mode", tool.query_metadata_mode],
    ["threshold", tool.threshold],
    ["scored examples", tool.n_scored_source_examples],
    ["likely_transfer", tool.likely_transfer_count],
    ["unlikely_transfer", tool.unlikely_transfer_count],
    ["P(transfer) min", tool.transfer_probability_min],
    ["P(transfer) median", tool.transfer_probability_median],
    ["P(transfer) mean", tool.transfer_probability_mean],
    ["P(transfer) max", tool.transfer_probability_max],
  ].filter(([,v])=>v !== null && v !== undefined && v !== "");
  const scoreRows = scores.length ? `<details open><summary>Source example scores (${scores.length})</summary>
    ${scores.map((score, index)=>`<div class="neighbor-card">
      <div>
        <span class="badge">score ${index + 1}</span>
        <span class="badge">${esc(score.transfer_prediction || "")}</span>
        <strong>P(transfer) ${esc(score.transfer_probability ?? "")}</strong>
      </div>
      ${kv("source_value_percent", score.source_value_percent)}
      ${score.source_metadata ? `<div class="json-body">${renderObjectFields(score.source_metadata)}</div>` : ""}
    </div>`).join("")}
  </details>` : "";
  return `<div>
    <div class="evidence-subtitle">Starling Transfer Tool</div>
    <div class="evidence-summary">
      ${summaryFields.map(([k,v])=>kv(k,v)).join("")}
      ${tool.llm_note ? kv("llm_note", tool.llm_note) : ""}
    </div>
    ${scoreRows}
  </div>`;
}
function renderQualitativeSourceExamples(examples){
  if(!Array.isArray(examples) || !examples.length) return "";
  return `<div>
    <div class="evidence-subtitle">Qualitative / contextual source records (${examples.length})</div>
    ${examples.map((example, index)=>`<div class="neighbor-card">
      <div><span class="badge">context ${index + 1}</span><strong>${esc(example.oral_bioavailability_value_text || "non-numeric oral bioavailability statement")}</strong></div>
      ${example.condition_text ? `<div class="evidence-text">${esc(example.condition_text)}</div>` : ""}
      ${example.support_text ? kv("support_text", example.support_text) : ""}
      ${example.bioavailability_report_type ? kv("report_type", example.bioavailability_report_type) : ""}
    </div>`).join("")}
  </div>`;
}
function renderKeyEvidence(e){
  const activity = Array.isArray(e.activity_values) && e.activity_values.length
    ? `<div>${kv("activity_values", e.activity_values.join("\n"))}</div>`
    : "";
  const effect =
    e.effect_on_clintox_reasoning ??
    e.effect_on_bioavailability_reasoning ??
    e.effect_on_bbb_reasoning ??
    e.effect_on_reasoning;
  return `<div class="neighbor-card key-evidence-card">
    <div>
      ${e.similarity != null ? `<span class="badge">sim ${esc(e.similarity)}</span>` : ""}
      ${e.similarity_bucket ? `<span class="badge">${esc(e.similarity_bucket)}</span>` : ""}
      ${e.transferability ? `<span class="badge">transfer ${esc(e.transferability)}</span>` : ""}
      <strong>${esc(e.molecule_chembl_id || e.source_molecule_id || e.molecule_id || "evidence")}</strong>
    </div>
    ${kv("assay_signal", e.assay_signal)}
    ${activity}
    ${kv("tool_summary", e.tool_summary)}
    ${kv("effect_on_reasoning", effect)}
  </div>`;
}
function renderGroupSummary(item){
  const c = item.content || item;
  return `<div class="neighbor-card">
    <div><strong>${esc(item.group_id || "group")}</strong> <span class="badge">${esc(item.status || "")}</span></div>
    ${typeof c === "object" ? renderJsonReadable(c) : `<div class="kv-val">${esc(c)}</div>`}
  </div>`;
}
function renderJsonValue(v){
  if(Array.isArray(v)) return renderJsonList(v);
  if(v && typeof v === "object") return `<div class="json-body">${renderObjectFields(v)}</div>`;
  return `<div class="json-body">${esc(formatInline(v))}</div>`;
}
els.loadBtn.onclick = () => loadPath(els.runSelect.value).catch(e=>alert(e.message));
els.refreshBtn.onclick = () => scanRuns().catch(e=>alert(e.message));
els.pathBtn.onclick = () => loadPath(els.pathInput.value).catch(e=>alert(e.message));
els.fileInput.onchange = async e => { const f=e.target.files[0]; if(f) addRecords(parseJsonl(await f.text(), f.name)); };
els.moleculeFilter.onchange = () => { state.moleculeKey = els.moleculeFilter.value; state.selected = 0; apply(); };
els.search.oninput = apply; els.toolFilter.onchange = apply;
els.priceCacheHit.oninput = apply;
els.priceCacheMiss.oninput = apply;
els.priceOutput.oninput = apply;
scanRuns().then(()=>{ if(state.runs[0]) loadPath(state.runs[0].path).catch(()=>{}); });
</script>
</body>
</html>
