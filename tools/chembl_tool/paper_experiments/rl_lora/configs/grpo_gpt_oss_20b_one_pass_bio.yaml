defaults: /local/tianang/nemo-rl/examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 8
  normalize_rewards: true
  use_leave_one_out_baseline: true
  seed: 42
  skip_reference_policy_logprobs_calculation: true
  max_num_epochs: 1
  max_num_steps: 419
  val_period: -1
  val_at_start: false
  val_at_end: false

loss_fn:
  use_importance_sampling_correction: true
  reference_policy_kl_penalty: 0.0

checkpointing:
  enabled: true
  checkpoint_dir: /local/tianang/txagent_rl_lora/checkpoints/gpt_oss_20b/one_pass_visible_bio
  save_period: 140
  keep_top_k: 3
  # Match the hosted run's 20-step rolling recovery cadence while retaining
  # the paper checkpoints at 140/280/final separately.
  ft_save_period: 20
  ft_keep_latest_k: 2
  save_optimizer: true

policy:
  model_name: /data1/tianang/cache/hub/models--openai--gpt-oss-20b/snapshots/6cee5e81ee83917806bbde320786a8fb61efebee
  tokenizer:
    name: /data1/tianang/cache/hub/models--openai--gpt-oss-20b/snapshots/6cee5e81ee83917806bbde320786a8fb61efebee
  train_global_batch_size: 32
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 65536
  make_sequence_length_divisible_by: 4
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    clear_memory_caches_before_refit: true
    attention_backend: auto
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    recompute_granularity: full
    # Keep output_layer.forward() in the graph so the unembedding LoRA is
    # actually optimized; NeMo's fused-logprob path bypasses that module.
    use_fused_linear_logprobs: false
    peft:
      enabled: true
      target_modules: [linear_qkv, linear_proj, linear_fc1, linear_fc2, output_layer]
      exclude_modules: []
      dim: 32
      alpha: 32
      dropout: 0.0
    optimizer:
      lr: 1.0e-4
      min_lr: 1.0e-4
      weight_decay: 0.0
    scheduler:
      lr_warmup_iters: 0
      lr_warmup_init: 1.0e-4
  sequence_packing:
    enabled: false
  generation:
    max_new_tokens: 6144
    temperature: 1.0
    top_p: 1.0
    stop_token_ids: [200002]
    vllm_cfg:
      tensor_parallel_size: 8
      # The exact full-data first batch leaves rank-dependent allocator
      # fragmentation after training. 0.40 still provides far more KV capacity
      # than 32 x 65,536 tokens while keeping a deterministic remap margin.
      gpu_memory_utilization: 0.40
      enforce_eager: true
    vllm_kwargs:
      moe_backend: triton

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: false
  train:
    data_path: /data1/tianang/Projects/TxAgent/outputs/paper/rl_lora_gpt_oss_120b/one_pass_full_flat_visible_prefetched_v1/data/train/bioavailability_ma.jsonl
    split_validation_size: 0
  validation: null
  default:
    dataset_name: ResponseDataset
    input_key: input
    output_key: output
    prompt_file: null
    system_prompt_file: null
    processor: starling_final_processor
    env_name: starling_binary

env:
  _override_: true
  starling_binary: {}

logger:
  log_dir: /local/tianang/txagent_rl_lora/logs/gpt_oss_20b/one_pass_visible_bio
  wandb_enabled: true
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: txagent-one-pass-rl
    name: bio-visible-gpt-oss-20b-rank32-all-nemo-20260811

cluster:
  num_nodes: 1
  gpus_per_node: 8
