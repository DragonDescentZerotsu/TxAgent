defaults: /local/tianang/nemo-rl/examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 1
  num_generations_per_prompt: 8
  skip_reference_policy_logprobs_calculation: true
  max_num_epochs: 1
  max_num_steps: 1
  val_period: -1
  val_at_start: false
  val_at_end: false

loss_fn:
  use_importance_sampling_correction: true
  reference_policy_kl_penalty: 0.0

checkpointing:
  enabled: true
  checkpoint_dir: /local/tianang/txagent_rl_lora/checkpoints/full_flat_feasibility_nonzero
  save_period: 1
  keep_top_k: 1
  save_optimizer: true

policy:
  model_name: /data1/tianang/cache/hub/models--openai--gpt-oss-120b/snapshots/b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  tokenizer:
    name: /data1/tianang/cache/hub/models--openai--gpt-oss-120b/snapshots/b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  train_global_batch_size: 8
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 8192
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    attention_backend: unfused
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: true
    recompute_granularity: full
    peft:
      enabled: true
      target_modules: [linear_qkv, linear_proj]
      exclude_modules: []
      dim: 16
      alpha: 32
      dropout: 0.0
  sequence_packing:
    enabled: false
  generation:
    max_new_tokens: 2048
    stop_token_ids: [200002]
    vllm_cfg:
      tensor_parallel_size: 8
      gpu_memory_utilization: 0.40
      enforce_eager: true
    vllm_kwargs:
      moe_backend: triton

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: false
  num_workers: 1
  use_multiple_dataloader: false
  train:
    data_path: /local/tianang/txagent_rl_lora/data/full_flat_feasibility_bbb_idx0.jsonl
    split_validation_size: 0
  validation: null
  default:
    dataset_name: ResponseDataset
    input_key: input
    output_key: output
    prompt_file: null
    system_prompt_file: null
    processor: starling_final_processor
    env_name: starling_binary

env:
  _override_: true
  starling_binary: {}

logger:
  log_dir: /local/tianang/txagent_rl_lora/logs/full_flat_feasibility_nonzero
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true

cluster:
  num_nodes: 1
  gpus_per_node: 8
