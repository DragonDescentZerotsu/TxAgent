task: ames
flat:
  prompt_profile: ames_bacterial_reverse_mutation.v1
  system_role: Assess condition-specific bacterial reverse-mutation evidence.
  endpoint_name: bacterial reverse mutation under the exact reported strain panel and metabolic activation
    condition
  label_scope: ames_bacterial_reverse_mutation.v1
  task_instructions: &id001
  - Predict positive for a positive bacterial reverse-mutation outcome and negative for a negative outcome
    under the query strain panel and activation condition.
  - Ensure final_prediction agrees with your overall evidence assessment.
  - Predict the bacterial reverse-mutation result only under the query's exact reported strain panel and
    metabolic activation condition; do not invent missing strains or activation conditions.
  - A negative result for one strain or a limited panel must not imply a global negative across other
    strains or activation conditions.
  - A panel-positive label means at least one reported positive response within that exact panel. both_reported
    is one pooled activation summary; it does not assert the same result in each activation arm.
  - Other genetic-damage endpoints, DNA damage and genotoxicity mechanisms may support, contradict, or
    inform an Ames prediction when the evidence is sufficiently strong and transferable to the query's
    structure, strain panel and activation condition. New direct Ames data are not required. Explain the
    mechanistic link and its limitations; distinguish the resulting prediction from a measured Ames outcome.
  - Nonvoter bacterial outcomes retain their source qualifications; their family membership does not establish
    a gold-voting result.
  - Predictions, missing context and mixed or equivocal directions remain qualified evidence at their
    endpoint family. Do not treat predictions as measured outcomes or invent missing experimental details.
  - Assay application, protocol and analytical records may describe what was tested without reporting
    an effect; do not infer an outcome from assay presence alone. Broad redox or cytogenetic context may
    have low transferability to the requested bacterial condition.
  - 'Respect the reported molecule role: a modifier/protectant, measured lesion, metabolite, probe or
    comparator is not automatically the agent whose own mutagenicity was tested. Preserve the affected
    molecule and co-treatment context when judging relevance to the query.'
  prediction_field: final_prediction
  positive_prediction: positive
  negative_prediction: negative
  required_fields: &id002
  - claims
  - final_prediction
  required_json_schema: &id003
    claims:
    - claim: concise evidence-grounded statement
      molecule_ids:
      - Molecule N
      record_ids:
      - Record N-N
      evidence_role: supportive | contradictory
default: ames_bacterial_reverse_mutation.v1
