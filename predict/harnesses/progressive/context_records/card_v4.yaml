# Executable model-visible record contract for progressive.assay_transfer.v4.
# V4 changes only the record representation: normalized V7 values are shown
# without falling back to source-native or resolved measurement fields.
schema_version: progressive_context_record_card.v4

context:
  fields:
    - name: context_card_id
      source: context_card_id
      required: true
    - name: canonical_smiles
      source: canonical_smiles
      required: true
    - name: condition_group
      source: condition_group
      required: true
    # V9 applicability estimate for the whole parent-condition context. It is
    # neither a task-label probability nor an experimental measurement.
    - name: transfer_likelihood
      source: transfer_likelihood
      required: true
    - name: available_record_counts
      source: available_record_counts
      required: true
  records_field: record_cards

record:
  fields:
    - name: card_id
      source: card_id
      required: true
    - name: level
      source: level
      required: true
    # Optional canonical fields are omitted when V7 has no normalized value.
    # Internal policy, category, eligibility, and label fields are never shown.
    - name: endpoint_name
      source: canonical_endpoint_name
    - name: endpoint_concept
      source: canonical_endpoint_concept
    - name: measurement_text
      source: canonical_measurement_text
    - name: unit_text
      source: canonical_unit_text
    - name: assay_context
      source: canonical_assay_context
    - name: species_context
      source: canonical_species_context
    - name: reference_scope
      source: canonical_reference_scope
    - name: reference_basis
      source: canonical_reference_basis
    - name: assay_type
      source: canonical_assay_type
    - name: evidence_type
      source: canonical_evidence_type
    - name: transport_mechanism
      source: canonical_transport_mechanism
    - name: transporter_identifier
      source: canonical_transporter_identifier
    - name: kinetic_symbol
      source: canonical_kinetic_symbol
    - name: bioavailability_report_type
      source: canonical_bioavailability_report_type
    - name: bioavailability_evidence_scope
      source: canonical_bioavailability_evidence_scope
    - name: oral_dose_value
      source: canonical_oral_dose_value
    - name: oral_dose_unit
      source: canonical_oral_dose_unit
    - name: oral_dose_basis
      source: canonical_oral_dose_basis
    - name: biological_matrix
      source: canonical_biological_matrix
    - name: assay_or_test
      source: canonical_assay_or_test
    - name: species_or_population
      source: canonical_species_or_population
    - name: severity_grade
      source: canonical_severity_grade
    - name: aop_event
      source: canonical_aop_event
    - name: assay_method
      source: canonical_assay_method
    - name: evidence_system
      source: canonical_evidence_system
    - name: study_design
      source: canonical_study_design
    # Evidence prose remains verbatim because V7 has no canonicalized support-
    # text field. It is not used as a fallback for missing structured values.
    - name: support_text
      source: source__support_text
