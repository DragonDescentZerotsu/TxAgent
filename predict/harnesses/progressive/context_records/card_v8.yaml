# Bioavailability-focused hybrid record contract for V8/V8.1.
# Canonical fields carry normalized meaning; source-native fields are retained
# only when they add experimental context without a canonical replacement.
schema_version: progressive_context_record_card.v8

context:
  fields:
    - name: context_card_id
      source: context_card_id
      required: true
    - name: canonical_smiles
      source: canonical_smiles
      required: true
    - name: condition_group
      source: condition_group
      required: true
    - name: transfer_likelihood
      source: transfer_likelihood
      required: true
    - name: available_record_counts
      source: available_record_counts
      required: true
  records_field: record_cards

record:
  fields:
    - name: card_id
      source: card_id
      required: true
    - name: level
      source: level
      required: true
    # Normalized measurement core.
    - name: endpoint_name
      source: canonical_endpoint_name
    - name: endpoint_concept
      source: canonical_endpoint_concept
    - name: measurement_text
      source: canonical_measurement_text
    - name: unit_text
      source: canonical_unit_text
    - name: assay_context
      source: canonical_assay_context
    - name: species_context
      source: canonical_species_context
    - name: reference_scope
      source: canonical_reference_scope
    - name: bioavailability_report_type
      source: canonical_bioavailability_report_type
    - name: bioavailability_evidence_scope
      source: canonical_bioavailability_evidence_scope
    - name: oral_dose_value
      source: canonical_oral_dose_value
    - name: oral_dose_unit
      source: canonical_oral_dose_unit
    - name: oral_dose_basis
      source: canonical_oral_dose_basis
    - name: biological_matrix
      source: canonical_biological_matrix
    # Source-native context with no complete canonical equivalent.
    - name: statistic_type
      source: source__statistic_type
    - name: study_context
      source: source__study_context
    - name: qualifying_conditions
      source: source__qualifying_conditions
    - name: dose
      source: source__dose
    - name: comparator
      source: source__comparator
    - name: comparator_exposure
      source: source__comparator_exposure
    - name: oral_exposure_mode
      source: source__oral_exposure_mode
    - name: condition_medium
      source: source__condition_medium
    - name: formulation_or_solid_form
      source: source__formulation_or_solid_form
    - name: molecular_form
      source: source__molecular_form
    - name: species_or_population
      source: source__species_or_population
    - name: confidence
      source: source__confidence
    - name: extra_details
      source: source__extra_details
    - name: support_text
      source: source__support_text
