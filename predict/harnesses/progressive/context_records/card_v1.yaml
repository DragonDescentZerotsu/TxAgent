# Executable model-visible contract for progressive.assay_transfer.v1.
# `source` names an internal field produced by profile.py. Required fields fail
# closed; blank optional record fields are omitted from the prompt.
schema_version: progressive_context_record_card.v1

context:
  fields:
    # Stable ID for this exact training parent + condition context.
    - name: context_card_id
      source: context_card_id
      required: true
    # Parent structure recorded by the current conditioned-gold release.
    - name: canonical_smiles
      source: canonical_smiles
      required: true
    # Exact external-condition signature used by the gold release.
    - name: condition_group
      source: condition_group
      required: true
    # Frozen V9 estimate that this context transfers to the query. This is an
    # applicability score, not a task-label probability or endpoint vote.
    - name: transfer_likelihood
      source: transfer_likelihood
      required: true
    # Counts the full raw-record pool before sampling at most ten per level.
    - name: available_record_counts
      source: available_record_counts
      required: true
  records_field: record_cards

record:
  fields:
    # Short prompt alias such as C01; restored to the stable artifact ID later.
    - name: card_id
      source: card_id
      required: true
    # L1 is a current-gold constituent; L2 is another record from the same
    # parent + exact condition context that did not contribute a current vote.
    - name: level
      source: level
      required: true
    - name: endpoint
      source: endpoint
    - name: result
      source: result
      required: true
    - name: unit
      source: unit
    - name: assay_context
      source: assay_context
    - name: species
      source: species
    - name: conditions
      source: conditions
    - name: support_text
      source: support_text
